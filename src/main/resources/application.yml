spring:
  application:
    name: webp-converter-java
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
  thymeleaf:
    cache: false
server:
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
info:
  app:
    name: WebP Converter
    description: Privacy-friendly WebP to PNG/JPG converter
